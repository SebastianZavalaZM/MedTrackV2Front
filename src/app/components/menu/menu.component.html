<mat-toolbar class ="custom-toolbar">
  <div>
    <button mat-button [matMenuTriggerFor]="menuUsuarios" class="btn-verde">
      <mat-icon>account_circle</mat-icon>
      Usuarios
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuTipoEnfermedad" class="btn-verde">
      <mat-icon>account_circle</mat-icon>
      Tipo de Enfermedad
    </button>
  </div>

  <div>

    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuMapa" class="btn-verde">
      <mat-icon>map icon</mat-icon>

    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuNotificaciones" class="btn-verde">
      <mat-icon>more</mat-icon>
      Notificaciones
    </button>
  </div>



</mat-toolbar>

<mat-menu #menuUsuarios="matMenu" class="menu-verde">

</mat-menu>
