<mat-toolbar class ="custom-toolbar" *ngIf="verificar()">

  <div>
    <button mat-button [routerLink]="['/homes']" style="color: white" class="btn-verde">
      <mat-icon>home</mat-icon>Home
    </button>
  </div>



  <div>
    <button mat-button [matMenuTriggerFor]="menuUsuarios" class="btn-verde" *ngIf="isDeveloper()">
      <mat-icon>account_circle</mat-icon>
      Usuarios
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuTipoEnfermedad" class="btn-verde">
      <mat-icon>account_circle</mat-icon>
      Tipo Enfermedad
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuForo" class="btn-verde" *ngIf="isDeveloper()">
      <mat-icon>forum</mat-icon>
      Foros
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuComentarioForo" class="btn-verde">
      <mat-icon>comment</mat-icon>
      Comentarios
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuEnfermedad" class="btn-verde">
      <mat-icon>account_circle</mat-icon>
      Enfermedades
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuTipoSuscripcion" class="btn-verde">
      <mat-icon>category</mat-icon>
      Tipos de Suscripción
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuSoporte" class="btn-verde">
      <mat-icon>support_agent</mat-icon>
      Soporte
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuMapa" class="btn-verde">
      <mat-icon>map icon</mat-icon>
      Mapas de Calor
    </button>
  </div>

  <div>
    <button mat-button [matMenuTriggerFor]="menuNotificaciones" class="btn-verde">
      <mat-icon>more</mat-icon>
      Notificaciones
    </button>
  </div>

  <!-- Botón: Reporte Ciudadano -->
  <div>
    <button mat-button [matMenuTriggerFor]="menuReporteCiudadano" class="btn-verde">
      <mat-icon>report_problem</mat-icon>
      Reporte Ciudadano
    </button>
  </div>

  <!-- Botón: Artículo Informativo -->
  <div>
    <button mat-button [matMenuTriggerFor]="menuArticuloInformativo" class="btn-verde">
      <mat-icon>article</mat-icon>
      Artículo Informativo
    </button>
  </div>

  <!-- Nuevo Botón: Landing Page -->
  <div>
    <a mat-button class="btn-verde"
       href="https://sites.google.com/view/enfermedades-por-calor/inicio-sesi%C3%B3n?authuser=0"
       target="_blank" rel="noopener">
      <mat-icon>launch</mat-icon>
      Landing Page
    </a>
  </div>

   <span class="toolbar-spacer"></span>
 <div class="right-menu">
    <button mat-button [matMenuTriggerFor]="menuSalir" class="btn-verde" >
      <mat-icon>person</mat-icon>Usuario
    </button>
 </div>




</mat-toolbar>

<mat-menu #menuSalir="matMenu">
  <button mat-menu-item routerLink="/login" (click)="cerrar()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
  <button mat-menu-item>
    Rol:
    <span>{{ role }}</span>
  </button>
</mat-menu>

<mat-menu #menuUsuarios="matMenu" class="menu-verde">
  <button mat-menu-item routerLink="/usuarios" class="item-verde">
    <mat-icon>list</mat-icon>
    <span>Listar</span>
  </button>
  <button mat-menu-item routerLink="/usuarios/formulario" class="item-verde">
    <mat-icon>how_to_reg</mat-icon>
    <span>Registrar</span>
  </button>
</mat-menu>

<mat-menu #menuTipoEnfermedad="matMenu" class="menu-verde">
  <button mat-menu-item routerLink="/tipoenfermedades/listas" class="item-verde"><mat-icon>list</mat-icon><span>Listar</span></button>
  <button mat-menu-item routerLink="/tipoenfermedades/listas/formulario" class="item-verde"><mat-icon>how_to_reg</mat-icon><span>Registrar</span></button>
  <button mat-menu-item routerLink="/tipoenfermedades/listas/buscarPorNombre" class="item-verde"><mat-icon>search</mat-icon><span>Buscar por nombre</span></button>
</mat-menu>
