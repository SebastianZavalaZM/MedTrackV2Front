<div class="container">
  <div style="text-align: center; margin: 5%;">
    <h1>Registro de Reporte Ciudadano</h1>
  </div>
  <div style="text-align: center;">
    <form [formGroup]="form" (ngSubmit)="aceptar()">

      <mat-form-field *ngIf="edicion">
        <mat-label>ID</mat-label>
        <input matInput formControlName="id_reporte_ciudadano" readonly>
        <mat-error *ngIf="form.get('id_reporte_ciudadano')?.hasError('required')">
          El código del reporte es obligatorio!!
        </mat-error>
      </mat-form-field>
      <br>

      <mat-form-field>
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fechaReporte">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.get('fechaReporte')?.hasError('required')">
          La fecha es obligatoria!!
        </mat-error>
      </mat-form-field>
      <br>

      <mat-form-field>
        <mat-label>Ciudad</mat-label>
        <input matInput formControlName="cuidad"> <!-- corregido a "cuidad" -->
        <mat-error *ngIf="form.get('cuidad')?.hasError('required')">
          La ciudad es obligatoria!!
        </mat-error>
      </mat-form-field>
      <br>

      <mat-form-field>
        <mat-label>Enfermedad</mat-label>
        <mat-select formControlName="enfermedad">
          <mat-option *ngFor="let food of listarenfermedades" [value]="food.idEnfermedad">
            {{food.nombre}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('enfermedad')?.hasError('required')">
          La enfermedad es obligatoria!!
        </mat-error>
      </mat-form-field>
      <br>

      <mat-form-field>
        <mat-label>Usuario</mat-label>
        <mat-select formControlName="users">
          <mat-option *ngFor="let food of listarusers" [value]="food.idUsers">
            {{food.username}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('users')?.hasError('required')">
          El usuario es obligatorio!!
        </mat-error>
      </mat-form-field>
      <br>

      <button mat-raised-button color="primary" type="submit">Aceptar</button>
      <button mat-raised-button color="warn" routerLink="/reporteciudadano/listas" type="button">
        Cancelar
      </button>

    </form>
  </div>
</div>
