<div class="container">
  <div class="titulo-busqueda">
    <h1>Buscar Artículos Informativos</h1>
  </div>

  <div class="form-busqueda">
    <input [(ngModel)]="keyword" placeholder="Palabra clave (título o contenido)" class="input-estilo" />
    <button mat-raised-button color="primary" (click)="buscar()">Buscar</button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 tabla-ovalada" *ngIf="dataSource">
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let element">{{element.titulo}}</td>
    </ng-container>

    <ng-container matColumnDef="contenido">
      <th mat-header-cell *matHeaderCellDef>Contenido</th>
      <td mat-cell *matCellDef="let element">{{element.contenido}}</td>
    </ng-container>

    <ng-container matColumnDef="autor">
      <th mat-header-cell *matHeaderCellDef>Autor</th>
      <td mat-cell *matCellDef="let element">{{element.users?.username}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
