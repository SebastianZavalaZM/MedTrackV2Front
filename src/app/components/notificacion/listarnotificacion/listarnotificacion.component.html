<div class="container">
  <div style="text-align: center;margin: 5%;">
    <h1>Lista de notificaciones</h1>
  </div>
  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 tabla-ovalada">

      <!-- Position Column -->
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef> ID. </th>
        <td mat-cell *matCellDef="let element"> {{element.idnotification}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef> Mensaje </th>
        <td mat-cell *matCellDef="let element"> {{element.mensaje}} </td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef> Fecha de Envío</th>
        <td mat-cell *matCellDef="let element"> {{element.fechaenvio|date:'dd/MM/yyyy'}} </td>
      </ng-container>

      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let element"> {{element.tipo}} </td>
      </ng-container>

      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef> Origen </th>
        <td mat-cell *matCellDef="let element"> {{element.origen}} </td>
      </ng-container>


      <!-- Position Column -->
      <ng-container matColumnDef="c6">
        <th mat-header-cell *matHeaderCellDef> ID del Mapa </th>
        <td mat-cell *matCellDef="let element"> {{element.mapacalor.idmapacalor}} </td>
      </ng-container>


      <!-- Update Column -->
      <ng-container matColumnDef="c7">
        <th mat-header-cell *matHeaderCellDef> Actualizar </th>
        <td mat-cell *matCellDef="let element">
          <button matButton [routerLink]="['ediciones',element.idnotification]"
          >
            <mat-icon style="">edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="c8">
        <th mat-header-cell *matHeaderCellDef> Eliminar </th>
        <td mat-cell *matCellDef="let element">
          <button matButton
                  (click)="eliminar(element.idnotification)">
            <mat-icon style="">delete_forever</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>


  </div>
</div>
