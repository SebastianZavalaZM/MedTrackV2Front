<div class="container">
  <div style="text-align: center;margin: 5%;">
    <h1>Lista de tipo de enfermedades</h1>
  </div>
  <div>
   <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 tabla-ovalada">

   <!-- ID TIPO ENFERMEDAD -->
  <ng-container matColumnDef="c1">
    <th mat-header-cell *matHeaderCellDef> ID. </th>
    <td mat-cell *matCellDef="let element"> {{element.idTipo}} </td>
  </ng-container>

  <!-- NOMBRE TIPO ENFERMEDAD -->
  <ng-container matColumnDef="c2">
    <th mat-header-cell *matHeaderCellDef> Tipo de enfermedad </th>
    <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
  </ng-container>

<!-- DESCRIPCIÓN -->
<ng-container matColumnDef="c3">
  <th mat-header-cell *matHeaderCellDef> Descripción </th>
  <td mat-cell *matCellDef="let element">
    <span *ngIf="element.descripcion" [matTooltip]="element.descripcion" matTooltipPosition="above">
      {{ element.descripcion | slice:0:40 }}<span *ngIf="element.descripcion.length > 40">...</span>
    </span>
    <span *ngIf="!element.descripcion">-</span>
  </td>
</ng-container>
   <!-- ID USUARIO -->
  <ng-container matColumnDef="c4">
    <th mat-header-cell *matHeaderCellDef> Usuario </th>
    <td mat-cell *matCellDef="let element"> {{element.users.idUsers}} </td>
  </ng-container>


<!-- ACTUALIZAR -->
      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef> Actualizar </th>
        <td mat-cell *matCellDef="let element">
          <button matButton [routerLink]="['ediciones',element.idTipo]"
          >
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- ELIMINAR -->
      <ng-container matColumnDef="c6">
        <th mat-header-cell *matHeaderCellDef> Eliminar </th>
        <td mat-cell *matCellDef="let element">
          <button matButton
                  (click)="eliminar(element.idTipo)"
          >
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
      </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>


  </div>
</div>
