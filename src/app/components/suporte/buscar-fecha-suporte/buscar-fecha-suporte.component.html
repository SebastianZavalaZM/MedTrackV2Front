<div class="container">
    <div style="text-align: center;margin: 5%;">
      <h1>Buscar por Fecha</h1>
    </div>
    
    <div style="display: flex; gap: 16px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;">
      <mat-form-field style="width: 200px;">
        <mat-label>Fecha Desde</mat-label>
        <input matInput [matDatepicker]="pickerDesde" [(ngModel)]="fechaDesde">
        <mat-datepicker-toggle matSuffix [for]="pickerDesde"></mat-datepicker-toggle>
        <mat-datepicker #pickerDesde></mat-datepicker>
      </mat-form-field>
      
      <mat-form-field style="width: 200px;">
        <mat-label>Fecha Hasta</mat-label>
        <input matInput [matDatepicker]="pickerHasta" [(ngModel)]="fechaHasta">
        <mat-datepicker-toggle matSuffix [for]="pickerHasta"></mat-datepicker-toggle>
        <mat-datepicker #pickerHasta></mat-datepicker>
      </mat-form-field>
      
      <button mat-raised-button color="primary" (click)="buscarPorRangoFechas()" class="btn-buscar">
        <mat-icon>search</mat-icon>
        Buscar
      </button>
    </div>
  
    <div>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 tabla-ovalada">
        
        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef>Título</th>
          <td mat-cell *matCellDef="let element">{{element.titulo || 'Sin título'}}</td>
        </ng-container>
  
        <ng-container matColumnDef="usuario">
          <th mat-header-cell *matHeaderCellDef>Usuario</th>
          <td mat-cell *matCellDef="let element">{{element.users?.username || 'N/A'}}</td>
        </ng-container>
  
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let element">{{element.fecha | date:'dd/MM/yyyy'}}</td>
        </ng-container>
  
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let element">{{element.descripcion || 'Sin descripción'}}</td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
